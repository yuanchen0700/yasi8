<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>下单成功 - DW Shop</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="{{ url_for('index') }}">DW<span class="dot">.</span>Shop</a>
  </div>
</div>
<main>
  <div class="panel" style="text-align: center;">
    <div style="font-size: 52px;">🎉</div>
    <h1 style="margin: 8px 0;">下单成功</h1>
    <p class="muted">订单号 #{{ order['id'] }} · {{ order['created_at'] }}</p>
    <p style="margin-top: 14px;">
      商品：<strong>{{ product['title'] }}</strong><br>
      联系方式：<strong>{{ order['contact'] }}</strong>
    </p>
    <p class="muted small" style="margin-top: 12px;">
      我会通过你留下的联系方式和你确认成交细节。如长时间未收到回复，可使用「订单查询」查看订单状态，或直接留言补充信息。
    </p>
    <p style="margin-top: 20px;"><a class="btn" href="{{ url_for('index') }}">返回商店逛逛</a></p>
  </div>
</main>
</body>
</html>
