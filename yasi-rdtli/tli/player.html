<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雅思考点词 · 歌词播放器</title>
<style>
  :root{
    --red:#ec4141;
    --bg-0:#0d1117; --bg-1:#141a24; --bg-2:#1c2330;
    --ink:#e6edf3; --ink-dim:#8b98a9; --cn:#5a6a7d;
    --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.16);
    --glass:rgba(255,255,255,.03); --glass-hover:rgba(255,255,255,.06);
    --chip:rgba(255,255,255,.05); --chip-hover:rgba(255,255,255,.10);
    --btn:rgba(255,255,255,.06); --btn-hover:rgba(255,255,255,.13);
    --title:#fff; --brand:#fff;
    --glow-red:rgba(194,12,12,.12); --glow-purple:rgba(90,50,160,.10);
    --topbar-bg:rgba(10,13,18,.78);
    --active-line:rgba(236,65,65,.07);
    --bar-bg:rgba(16,20,27,.92);
    --shadow:0 16px 44px rgba(0,0,0,.6);
    --seek-track:rgba(255,255,255,.10);
    --toast-bg:rgba(10,13,18,.95);
    --modal-bg:#171e2a; --modal-line:rgba(255,255,255,.10);
    --input-bg:rgba(255,255,255,.05);
    --voice-bg:rgba(80,200,140,.12); --voice-ink:#7ee2a8; --voice-line:rgba(80,200,140,.3);
    --overlay:rgba(0,0,0,.45);
  }
  body[data-theme="light"]{
    --bg-0:#eef1f8; --bg-1:#ffffff; --bg-2:#eef0f6;
    --ink:#24262f; --ink-dim:#6b7280; --cn:#97a0b2;
    --line:rgba(20,25,40,.10); --line-strong:rgba(20,25,40,.18);
    --glass:rgba(20,25,40,.03); --glass-hover:rgba(20,25,40,.06);
    --chip:rgba(20,25,40,.05); --chip-hover:rgba(20,25,40,.10);
    --btn:rgba(20,25,40,.05); --btn-hover:rgba(20,25,40,.10);
    --title:#17181c; --brand:#17181c;
    --glow-red:rgba(236,65,65,.07); --glow-purple:rgba(90,50,160,.05);
    --topbar-bg:rgba(255,255,255,.84);
    --active-line:rgba(236,65,65,.10);
    --bar-bg:rgba(255,255,255,.96);
    --shadow:0 16px 44px rgba(40,48,70,.20);
    --seek-track:rgba(20,25,40,.12);
    --toast-bg:rgba(30,34,46,.95);
    --modal-bg:#ffffff; --modal-line:rgba(20,25,40,.12);
    --input-bg:rgba(20,25,40,.04);
    --voice-bg:rgba(20,150,90,.12); --voice-ink:#0a8f5d; --voice-line:rgba(20,150,90,.35);
    --overlay:rgba(40,50,80,.35);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 600px at 15% 0%, var(--glow-red) 0%, transparent 55%),
      radial-gradient(800px 600px at 100% 100%, var(--glow-purple) 0%, transparent 55%),
      linear-gradient(160deg,var(--bg-1),var(--bg-0));
    min-height:100%; -webkit-font-smoothing:antialiased;
    transition:background .25s ease, color .25s ease;
  }
  a{color:var(--ink-dim); text-decoration:none}
  a:hover{color:var(--ink)}
  .topbar{
    position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:14px;
    padding:12px 24px; background:var(--topbar-bg);
    backdrop-filter:saturate(150%) blur(12px); border-bottom:1px solid var(--line);
    transition:background .25s ease;
  }
  .back{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--ink-dim)}
  .back:hover{color:var(--ink)}
  .brand{font-weight:800; font-size:18px; letter-spacing:-.3px; color:var(--brand)}
  .brand b{color:var(--red)}
  .brand small{font-weight:500; font-size:12px; color:var(--ink-dim); margin-left:8px}
  .topbar-right{margin-left:auto; display:flex; gap:8px; align-items:center}
  .tb-btn{appearance:none; cursor:pointer; font:500 13px/1 inherit; color:var(--ink);
    background:var(--btn); border:1px solid var(--line); border-radius:999px;
    padding:8px 14px; transition:all .15s;}
  .tb-btn:hover{background:var(--btn-hover); border-color:var(--line-strong)}
  .tb-btn.active{background:var(--red); color:#fff; border-color:transparent}
  .tb-btn .dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--red); margin-right:6px; vertical-align:middle}
  .tb-btn.active .dot{background:#ffd9d9}
  #btnSonglist{display:none}

  .layout{display:grid; grid-template-columns:330px 1fr; gap:18px; max-width:1200px;
    margin:0 auto; padding:18px 24px 140px;}
  @media (max-width:880px){ .layout{grid-template-columns:1fr; padding:12px 12px 150px} }

  /* === 左侧歌单 === */
  .sidebar{background:var(--glass); border:1px solid var(--line); border-radius:14px;
    padding:12px; height:fit-content; position:sticky; top:70px;
    max-height:calc(100vh - 100px); overflow:auto;}
  .sidebar h3{margin:4px 4px 10px; font:600 11px/1 inherit; letter-spacing:.18em;
    text-transform:uppercase; color:var(--ink-dim); display:flex; justify-content:space-between; align-items:center}
  .sidebar h3 .cnt{letter-spacing:0; color:var(--red); font:700 13px/1 inherit}
  .search{width:100%; margin:0 0 10px; padding:8px 12px; background:var(--input-bg);
    border:1px solid var(--line); border-radius:9px; color:var(--ink); font:inherit; font-size:13px}
  .search:focus{outline:none; border-color:var(--red)}
  .mode-line{display:flex; gap:6px; margin:0 0 10px}
  .mode-chip{flex:1; text-align:center; font-size:12px; padding:6px 4px; border-radius:8px;
    border:1px solid var(--line); color:var(--ink-dim); cursor:pointer; background:var(--glass)}
  .mode-chip:hover{border-color:var(--line-strong)}
  .mode-chip.on{background:rgba(236,65,65,.14); color:var(--red); border-color:rgba(236,65,65,.45); font-weight:600}
  .songlist{display:flex; flex-direction:column}
  .song{display:grid; grid-template-columns:26px 1fr auto; gap:8px; align-items:center;
    padding:8px 10px; border-radius:9px; cursor:pointer; font-size:12.5px; transition:background .12s;}
  .song:hover{background:var(--glass-hover)}
  .song.active{background:var(--active-line); box-shadow:inset 2px 0 0 var(--red)}
  .song .no{font:600 11px/1 ui-monospace,monospace; color:var(--ink-dim); text-align:center}
  .song.active .no{color:var(--red)}
  .song .tt{min-width:0}
  .song .tt .en{color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.3}
  .song .tt .kw{color:var(--ink-dim); font-size:10.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px}
  .song .dur{font-size:10.5px; color:var(--ink-dim); font-variant-numeric:tabular-nums}
  .song.playing .dur{color:var(--red)}
  .fav-seg{margin-top:10px}
  .fav-play{width:100%; appearance:none; cursor:pointer; font:600 12.5px/1 inherit; color:#fff;
    background:linear-gradient(135deg,#ec4141,#ff6a6a); border:none; border-radius:10px;
    padding:11px 12px; margin-bottom:8px; transition:all .15s;}
  .fav-play:hover{filter:brightness(1.1)}
  .fav-play:disabled{opacity:.45; cursor:not-allowed}
  .fav-empty{text-align:center; color:var(--ink-dim); padding:34px 10px; font-size:12.5px; line-height:1.9}
  .fav-del{appearance:none; background:transparent; border:none; color:var(--ink-dim);
    cursor:pointer; font-size:12px; padding:4px 6px; border-radius:6px}
  .fav-del:hover{color:var(--red); background:rgba(236,65,65,.12)}
  .song.faved .no{color:#f5b30e}

  /* === 歌词面板 === */
  .main{min-width:0}
  .lyric-card{background:var(--glass); border:1px solid var(--line); border-radius:16px;
    padding:34px 38px 40px; position:relative; overflow:hidden; min-height:calc(100vh - 200px);
    display:flex; flex-direction:column; transition:background .25s ease;}
  .lyric-card::before{content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(500px 200px at 85% 0%, rgba(236,65,65,.10), transparent 60%);}
  .lc-head{display:flex; align-items:baseline; gap:12px; margin-bottom:8px; position:relative; flex-wrap:wrap}
  .lc-kw{font-size:22px; font-weight:800; color:var(--title)}
  .lc-type{font-size:11px; color:var(--red); background:rgba(236,65,65,.15); border:1px solid rgba(236,65,65,.4);
    border-radius:6px; padding:2px 8px; font-weight:700}
  .lc-meaning{font-size:13px; color:var(--ink-dim)}
  .lc-voice{margin-left:auto; font-size:12px; color:var(--voice-ink); background:var(--voice-bg);
    border:1px solid var(--voice-line); border-radius:999px; padding:4px 10px; font-weight:600}
  .lyric{position:relative; margin-top:26px; flex:1; overflow:auto; max-height:60vh}
  .lyric-off{text-align:center; color:var(--ink-dim); padding:70px 0; font-size:13px}
  .lyric-line{padding:14px 10px; border-radius:12px; transition:all .25s ease; cursor:pointer}
  .lyric-line:hover{background:var(--glass-hover)}
  .lyric-line .en{font-size:clamp(16px,2.2vw,21px); line-height:1.55; color:var(--ink-dim); font-weight:500; transition:color .2s}
  .lyric-line .cn{font-size:13px; color:var(--cn); margin-top:3px; line-height:1.6; transition:color .2s}
  .lyric-line.active .en{color:var(--title); font-weight:700}
  .lyric-line.active .cn{color:var(--red); font-weight:600}
  .lyric-line.active{background:var(--active-line); box-shadow:inset 3px 0 0 var(--red)}

  /* === 最近播放 === */
  .history-panel{display:none}
  .history-panel.show{display:block}
  .h-title{font-size:15px; font-weight:700; margin:0 0 14px; color:var(--title)}
  .h-item{display:grid; grid-template-columns:1fr auto auto; gap:12px; align-items:center;
    padding:11px 14px; background:var(--glass); border:1px solid var(--line);
    border-radius:11px; margin-bottom:8px; cursor:pointer; transition:all .15s;}
  .h-item:hover{background:var(--glass-hover); border-color:var(--line-strong)}
  .h-item .t{min-width:0}
  .h-item .t .en{font-size:13.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .h-item .t .kw{font-size:11px; color:var(--ink-dim); margin-top:3px}
  .h-item .when{font-size:11.5px; color:var(--ink-dim); font-variant-numeric:tabular-nums}
  .h-item .del{appearance:none; background:transparent; border:none; color:var(--ink-dim);
    cursor:pointer; font-size:15px; padding:4px 6px; border-radius:6px}
  .h-item .del:hover{color:var(--red); background:rgba(236,65,65,.1)}
  .h-empty{text-align:center; color:var(--ink-dim); padding:50px 0; font-size:13px}
  .h-clear{appearance:none; cursor:pointer; background:transparent; border:1px solid var(--line);
    color:var(--ink-dim); font:500 12px/1 inherit; border-radius:999px; padding:6px 12px; float:right}
  .h-clear:hover{color:var(--red); border-color:rgba(236,65,65,.5)}

  /* === 设置面板 === */
  .settings-overlay{position:fixed; inset:0; background:var(--overlay); z-index:95; opacity:0;
    pointer-events:none; transition:opacity .2s}
  .settings-overlay.show{opacity:1; pointer-events:auto}
  .settings{position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:100;
    width:min(440px, calc(100vw - 24px)); background:var(--modal-bg); border:1px solid var(--modal-line);
    border-radius:16px; padding:20px 22px; box-shadow:var(--shadow); display:none; max-height:86vh; overflow:auto;
    transition:background .25s ease;}
  .settings.show{display:block}
  .settings-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:2px}
  .settings h2{font-size:16px; color:var(--title); margin:0}
  .settings-x{appearance:none; background:transparent; border:none; color:var(--ink-dim);
    font-size:17px; cursor:pointer; padding:4px 6px; border-radius:8px}
  .settings-x:hover{color:var(--red); background:var(--glass-hover)}
  .set-row{display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:14px 2px; border-bottom:1px solid var(--line)}
  .set-row:last-child{border-bottom:none}
  .set-row .lbl{font-size:13.5px; color:var(--ink)}
  .set-row .sub{font-size:11.5px; color:var(--ink-dim); margin-top:3px}
  .set-row .right{display:flex; align-items:center; gap:10px}
  .theme-seg{display:flex; gap:2px; background:var(--chip); border-radius:999px; padding:3px}
  .theme-seg button{appearance:none; cursor:pointer; border:none; background:transparent;
    color:var(--ink-dim); font:500 12px/1 inherit; border-radius:999px; padding:7px 13px; transition:all .15s}
  .theme-seg button.on{background:var(--red); color:#fff}
  .switch{position:relative; width:42px; height:24px; flex:none}
  .switch input{opacity:0; width:0; height:0; position:absolute}
  .switch .track{position:absolute; inset:0; border-radius:999px; background:var(--seek-track); transition:.2s; cursor:pointer}
  .switch input:checked + .track{background:var(--red)}
  .switch .knob{position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%;
    background:#fff; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .switch input:checked + .track + .knob{left:21px}
  .mini-btn{appearance:none; cursor:pointer; background:var(--chip); border:1px solid var(--line);
    color:var(--ink-dim); font:500 11px/1 inherit; border-radius:999px; padding:7px 11px; transition:all .15s}
  .mini-btn:hover{color:var(--red); border-color:rgba(236,65,65,.5)}

  /* === 底部播放条 === */
  .playerbar{position:fixed; left:50%; transform:translateX(-50%); bottom:16px; width:min(880px, calc(100vw - 24px));
    background:var(--bar-bg); backdrop-filter:saturate(160%) blur(16px);
    border:1px solid var(--line-strong); border-radius:18px; padding:12px 18px 10px;
    box-shadow:var(--shadow); z-index:60; transition:background .25s ease;}
  .pb-track{display:flex; align-items:center; gap:10px}
  .pb-title{min-width:0; font-size:13px; font-weight:600; color:var(--title); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1}
  .pb-sub{font-size:11px; color:var(--ink-dim); white-space:nowrap; max-width:40%; overflow:hidden; text-overflow:ellipsis}
  .pb-controls{display:flex; align-items:center; justify-content:center; gap:8px; margin:10px 0 6px}
  .pb-btn{appearance:none; cursor:pointer; width:38px; height:38px; border-radius:50%;
    background:var(--btn); border:1px solid var(--line); color:var(--ink);
    display:grid; place-items:center; font-size:15px; transition:all .15s;}
  .pb-btn:hover{background:var(--btn-hover); border-color:var(--line-strong)}
  .pb-btn.play{width:50px; height:50px; background:linear-gradient(135deg,#ec4141,#ff6a6a);
    color:#fff; border-color:transparent; font-size:19px; box-shadow:0 6px 22px rgba(236,65,65,.4);}
  .pb-btn.play:hover{transform:scale(1.05)}
  .pb-btn.mode{background:transparent; border:none; color:var(--ink-dim); width:32px; height:32px; font-size:14px}
  .pb-btn.mode.on{color:var(--red)}
  .pb-btn.fav{background:transparent; border:none; width:34px; height:34px; font-size:17px; color:var(--ink-dim)}
  .pb-btn.fav.on{color:#f5b30e; text-shadow:0 0 14px rgba(245,179,14,.55)}
  .pb-seek{display:flex; align-items:center; gap:10px}
  .pb-time{font-size:11px; color:var(--ink-dim); font-variant-numeric:tabular-nums; min-width:88px; text-align:center}
  .seek{flex:1; height:4px; border-radius:999px; background:var(--seek-track); cursor:pointer; position:relative; overflow:hidden}
  .seek .fill{position:absolute; left:0; top:0; bottom:0; width:0%; background:linear-gradient(90deg,#ec4141,#ff8a8a); border-radius:999px}
  .toast{position:fixed; bottom:96px; left:50%; transform:translateX(-50%); z-index:90;
    background:var(--toast-bg); border:1px solid var(--line-strong); color:#fff;
    padding:9px 18px; border-radius:999px; font-size:13px; opacity:0; pointer-events:none; transition:all .25s;}
  .toast.show{opacity:1}
  .gap-hint{display:none; align-items:center; gap:6px; flex:none; font-size:12px; color:var(--red);
    background:rgba(236,65,65,.12); border:1px solid rgba(236,65,65,.4); border-radius:999px;
    padding:5px 11px; cursor:pointer; font-weight:600; white-space:nowrap}
  .gap-hint.show{display:inline-flex}
  .gap-range{width:130px; accent-color:var(--red)}

  /* === 移动端适配 === */
  .sidebar-overlay{position:fixed; inset:0; background:var(--overlay); z-index:65; opacity:0;
    pointer-events:none; transition:opacity .2s; display:none}
  @media (max-width:720px){
    .topbar{padding:10px 12px; gap:8px}
    .back{font-size:12px}
    .brand{font-size:16px}
    .brand small{display:none}
    .tb-btn{padding:7px 11px; font-size:12px}
    #btnSonglist{display:inline-flex}
    .layout{padding:10px 10px 132px; gap:10px}
    .sidebar{position:fixed; left:0; top:0; bottom:0; width:84vw; max-width:320px; z-index:70;
      border-radius:0 14px 14px 0; transform:translateX(-105%); transition:transform .25s ease;
      max-height:none; margin:0; background:var(--modal-bg);}
    .sidebar.open{transform:none; box-shadow:var(--shadow)}
    .sidebar-overlay{display:block}
    .sidebar-overlay.show{opacity:1; pointer-events:auto}
    .lyric-card{padding:20px 16px 26px; min-height:calc(100vh - 220px)}
    .lc-kw{font-size:19px}
    .lc-meaning{display:none}
    .lc-voice{margin-left:0}
    .lyric{max-height:calc(100vh - 320px); margin-top:18px}
    .lyric-line{padding:10px 8px}
    .lyric-line .en{font-size:clamp(15px,4.6vw,18px)}
    .lyric-line .cn{font-size:12.5px}
    .playerbar{bottom:10px; width:calc(100vw - 16px); border-radius:14px; padding:10px 12px 8px}
    .pb-sub{display:none}
    .pb-btn{width:34px; height:34px; font-size:13px}
    .pb-btn.play{width:44px; height:44px; font-size:17px}
    .pb-btn.mode{width:30px; height:30px}
    .pb-time{font-size:10px; min-width:76px}
    .h-item{grid-template-columns:1fr auto; gap:8px}
  }
</style>
<script>
  try{
    var __s = JSON.parse(localStorage.getItem('tli::playerSettings::v1') || '{}');
    document.body.setAttribute('data-theme', __s.theme === 'light' ? 'light' : 'dark');
  }catch(e){}
</script>
</head>
<body data-theme="dark">
<header class="topbar">
  <a class="back" href="../index.html">← 学习中心</a>
  <div class="brand">雅思考点词<b>♪</b><small>歌词播放器</small></div>
  <div class="topbar-right">
    <button class="tb-btn" id="btnSonglist">☰ 歌单</button>
    <button class="tb-btn active" id="btnLyric">♪ 歌词</button>
    <button class="tb-btn" id="btnHistory"><span class="dot"></span>最近播放</button>
    <button class="tb-btn" id="btnSettings">⚙ 设置</button>
  </div>
</header>

<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="settings-overlay" id="settingsOverlay"></div>

<div class="settings" id="settingsPanel">
  <div class="settings-head">
    <h2>播放器设置</h2>
    <button class="settings-x" id="btnSettingsX">✕</button>
  </div>
  <div class="set-row">
    <div class="lbl">主题外观<div class="sub">深色 / 浅色</div></div>
    <div class="right">
      <div class="theme-seg" id="themeSeg">
        <button data-theme-val="dark">深色</button>
        <button data-theme-val="light">浅色</button>
      </div>
    </div>
  </div>
  <div class="set-row">
    <div class="lbl">句间暂停<div class="sub">句子播完后停顿，便于跟读</div></div>
    <div class="right">
      <span class="sub" id="gapVal" style="min-width:44px;text-align:right">1 秒</span>
      <input class="gap-range" type="range" id="optGap" min="0" max="10" step="0.5">
    </div>
  </div>
  <div class="set-row">
    <div class="lbl">隐藏全部字幕<div class="sub">不显示英文与中文歌词</div></div>
    <div class="right">
      <label class="switch"><input type="checkbox" id="optHide"><span class="track"></span><span class="knob"></span></label>
    </div>
  </div>
  <div class="set-row">
    <div class="lbl">显示中文歌词<div class="sub">关闭后仅显示英文</div></div>
    <div class="right">
      <label class="switch"><input type="checkbox" id="optCn" checked><span class="track"></span><span class="knob"></span></label>
    </div>
  </div>
  <div class="set-row">
    <div class="lbl">音频缓存<div class="sub" id="cacheInfo">播放过的音频将缓存在浏览器</div></div>
    <div class="right">
      <label class="switch"><input type="checkbox" id="optCache" checked><span class="track"></span><span class="knob"></span></label>
      <button class="mini-btn" id="btnClearCache">清缓存</button>
    </div>
  </div>
</div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <h3>播放列表 <span class="cnt" id="songCount"></span></h3>
    <div class="mode-line fav-seg">
      <div class="mode-chip on" data-view="all">全部句子</div>
      <div class="mode-chip" data-view="fav">收藏夹 <span id="favCount"></span></div>
    </div>
    <input class="search" id="search" placeholder="搜索考点词 / 例句..." autocomplete="off">
    <div class="mode-line" data-type-filter>
      <div class="mode-chip" data-mode="word">考点词</div>
      <div class="mode-chip" data-mode="synonym">同义词</div>
      <div class="mode-chip on" data-mode="all">全部</div>
    </div>
    <div class="songlist" id="songlist"></div>
  </aside>

  <main class="main">
    <div class="lyric-card" id="lyricPanel">
      <div class="lc-head">
        <span class="lc-kw" id="lcKw">—</span>
        <span class="lc-type" id="lcType">考点词</span>
        <span class="lc-meaning" id="lcMeaning"></span>
        <span class="lc-voice" id="lcVoice"></span>
      </div>
      <div class="lyric" id="lyric"></div>
    </div>

    <div class="history-panel" id="historyPanel">
      <h2 class="h-title">最近播放 <span style="font-size:12px;color:var(--ink-dim);font-weight:400">（保存在本机 localStorage）</span></h2>
      <button class="h-clear" id="btnClearHist">清空记录</button>
      <div id="historyList" style="margin-top:14px"></div>
    </div>
  </main>
</div>

<footer class="playerbar" id="playerbar">
  <div class="pb-track">
    <div class="pb-title" id="pbTitle">请选择一句开始学习</div>
    <div class="pb-sub" id="pbSub"></div>
    <span class="gap-hint" id="gapHint" title="点击立即播放下一句"></span>
  </div>
  <div class="pb-controls">
    <button class="pb-btn mode" id="modeBtn" title="播放模式"></button>
    <button class="pb-btn" id="pbPrev" title="上一句">⏮</button>
    <button class="pb-btn play" id="pbPlay" title="播放/暂停">▶</button>
    <button class="pb-btn" id="pbNext" title="下一句">⏭</button>
    <button class="pb-btn fav" id="pbFav" title="收藏/取消收藏">☆</button>
    <button class="pb-btn mode" id="reverseBtn" title="顺序/倒序播放"></button>
  </div>
  <div class="pb-seek">
    <span class="pb-time" id="pbTime">0:00 / 0:00</span>
    <div class="seek" id="pbSeek"><div class="fill" id="pbFill"></div></div>
  </div>
</footer>

<audio id="audio" preload="auto"></audio>
<div class="toast" id="toast"></div>

<script>
"use strict";
var $ = function(id){ return document.getElementById(id); };

/* ===== 数据 ===== */
var DATA = null;
var SONGS = [];          // 每句一首歌：{id, type, keyword, meaning, en, cn, voice, audio}
var PLAYLIST = [];       // 当前过滤后列表 [{id,...}]
var curIdx = -1;         // PLAYLIST 中的当前序号
var mode = 'order';      // order 顺序 | single 单曲 | random 随机
var reverse = false;     // 倒序播放（上一首方向）
var activeType = 'all';
var query = '';

var HISTORY_KEY = 'tli::playHistory::v1';
var SET_KEY = 'tli::playerSettings::v1';
var CACHE_NAME = 'tli-audio-v1';
var FAV_KEY = 'tli::favorites::v1';

var viewMode = 'all';      // all 全部句子 | fav 收藏夹
var favMode = false;       // 是否正在收藏序列播放
var favPos = -1;           // 当前句在收藏序列中的位置

/* ===== 设置（localStorage 持久化） ===== */
var settings = { theme:'dark', hideLyric:false, showCn:true, cacheAudio:true, gapPause:1 };
function loadSettings(){
  try{
    var s = JSON.parse(localStorage.getItem(SET_KEY) || '{}');
    for(var k in s) if(k in settings) settings[k] = s[k];
  }catch(e){}
}
function saveSettings(){
  try{ localStorage.setItem(SET_KEY, JSON.stringify(settings)); }catch(e){}
}
function applyTheme(){
  document.body.setAttribute('data-theme', settings.theme);
  document.querySelectorAll('#themeSeg button').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-theme-val') === settings.theme);
  });
}
function applySettingsUI(){
  $("optHide").checked = settings.hideLyric;
  $("optCn").checked = settings.showCn;
  $("optCache").checked = settings.cacheAudio;
  $("optGap").value = settings.gapPause;
  $("gapVal").textContent = settings.gapPause + ' 秒';
  applyTheme();
}
loadSettings();
applySettingsUI();

/* ===== 音频缓存（Cache Storage） ===== */
function cacheSupported(){ return ('caches' in window); }
function cacheKey(url){ return new URL(url, location.href).href; }
async function cachedAudioUrl(url){
  if(!cacheSupported() || !settings.cacheAudio) return url;
  try{
    var c = await caches.open(CACHE_NAME);
    var key = cacheKey(url);
    var res = await c.match(key);
    if(!res){
      res = await fetch(url);
      if(res && res.ok) c.put(key, res.clone());
    }
    if(!res) return url;
    return URL.createObjectURL(await res.blob());
  }catch(e){ return url; }
}
function fmtBytes(b){
  if(b < 1024) return b + ' B';
  if(b < 1048576) return (b/1024).toFixed(1) + ' KB';
  return (b/1048576).toFixed(1) + ' MB';
}
async function refreshCacheInfo(){
  var el = $("cacheInfo");
  if(!cacheSupported()){ el.textContent = '当前浏览器不支持缓存'; return; }
  try{
    var c = await caches.open(CACHE_NAME);
    var keys = await c.keys();
    var total = 0;
    for(var i=0; i<keys.length; i++){
      var r = await c.match(keys[i]);
      if(r) total += (await r.arrayBuffer()).byteLength;
    }
    el.textContent = '已缓存 ' + fmtBytes(total) + ' / ' + keys.length + ' 个音频';
  }catch(e){ el.textContent = '缓存信息不可用'; }
}
async function clearAudioCache(){
  if(!cacheSupported()) return;
  try{
    var c = await caches.open(CACHE_NAME);
    var keys = await c.keys();
    await Promise.all(keys.map(function(k){ return c.delete(k); }));
    refreshCacheInfo();
    toast('已清除音频缓存');
  }catch(e){}
}

function loadHistory(){ try{ return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }catch(e){ return []; } }
function saveHistory(h){ try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(h)); }catch(e){} }

function addHistory(song){
  var h = loadHistory().filter(function(x){ return x.id !== song.id; });
  h.unshift({ id:song.id, en:song.en, cn:song.cn, kw:song.keyword, meaning:song.meaning,
    voice:song.voice, audio:song.audio, ts:Date.now() });
  if(h.length > 300) h = h.slice(0,300);
  saveHistory(h);
}

/* ===== 收藏 ===== */
function loadFavorites(){ try{ return JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); }catch(e){ return []; } }
function saveFavorites(f){ try{ localStorage.setItem(FAV_KEY, JSON.stringify(f)); }catch(e){} }
function isFavorite(id){ return loadFavorites().some(function(x){ return x.id === id; }); }
function updateFavBtn(){
  var s = curIdx >= 0 ? PLAYLIST[curIdx] : null;
  var on = !!(s && isFavorite(s.id));
  $("pbFav").textContent = on ? '★' : '☆';
  $("pbFav").classList.toggle('on', on);
  $("pbFav").title = on ? '取消收藏' : '收藏当前句子';
}
function toggleFavorite(){
  var s = curIdx >= 0 ? PLAYLIST[curIdx] : null;
  if(!s){ toast('请先播放一句再收藏'); return; }
  var favs = loadFavorites();
  var i = favs.findIndex(function(x){ return x.id === s.id; });
  if(i >= 0){
    favs.splice(i, 1);
    saveFavorites(favs);
    toast('已取消收藏');
  }else{
    favs.push({ id:s.id, en:s.en, cn:s.cn, keyword:s.keyword, meaning:s.meaning,
      voice:s.voice, audio:s.audio, ts:Date.now() });
    if(favs.length > 300) favs = favs.slice(-300);
    saveFavorites(favs);
    toast('已收藏，可在歌单「收藏夹」查看');
  }
  updateFavBtn();
  if(viewMode === 'fav') renderSonglist();
}

var VOICE_LABEL = {
  'en-GB-RyanNeural':'英音·男', 'en-US-JennyNeural':'美音·女',
  'en-AU-WilliamNeural':'澳音·男', 'en-GB-SoniaNeural':'英音·女',
  'en-US-GuyNeural':'美音·男', 'en-CA-ClaraNeural':'加音·女',
  'en-IE-EmilyNeural':'爱尔兰·女', 'en-NZ-MitchellNeural':'新西兰·男'
};

function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmt(sec){ if(!isFinite(sec)||sec<0) return "0:00"; var m=Math.floor(sec/60), s=Math.round(sec%60); return m+":"+String(s).padStart(2,"0"); }
var toastTimer = null;
function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove("show"); },1800); }

/* ===== 歌曲构建 ===== */
function buildSongs(){
  SONGS = [];
  var entries = DATA.entries;
  for(var i=0; i<entries.length; i++){
    var e = entries[i];
    for(var j=0; j<e.sentences.length; j++){
      var s = e.sentences[j];
      SONGS.push({
        id: i*1000 + j,          // 唯一 id
        type: e.type,
        keyword: e.keyword,
        meaning: e.meaning,
        en: s.en,
        cn: s.cn,
        voice: s.voice,
        audio: s.audio,
        entryIdx: i
      });
    }
  }
}

function filterPlaylist(){
  PLAYLIST = SONGS.filter(function(s){
    if(activeType !== 'all' && s.type !== activeType) return false;
    if(!query) return true;
    var q = query.toLowerCase();
    return (s.keyword+' '+s.meaning+' '+s.en+' '+s.cn).toLowerCase().indexOf(q) >= 0;
  });
  // 保持当前播放的歌曲仍在列表中时 curIdx 指向正确
  var cur = curIdx >= 0 ? PLAYLIST[curIdx] : null;
  if(cur) curIdx = PLAYLIST.findIndex(function(s){ return s.id === cur.id; });
}

function renderSonglist(){
  $("favCount").textContent = loadFavorites().length;
  if(viewMode === 'fav'){ renderFavList(); return; }
  filterPlaylist();
  $("songCount").textContent = PLAYLIST.length;
  $("search").style.display = '';
  document.querySelectorAll('.mode-line[data-type-filter] .mode-chip').forEach(function(c){ c.style.display = ''; });
  var el = $("songlist");
  el.innerHTML = PLAYLIST.map(function(s, i){
    var active = (i === curIdx);
    return '<div class="song'+(active?' active':'')+(isFavorite(s.id)?' faved':'')+'" data-i="'+i+'">'+
      '<span class="no">'+(active?'♪':(i+1))+'</span>'+
      '<span class="tt"><div class="en">'+esc(s.en)+'</div>'+
      '<div class="kw">'+esc(s.keyword)+' · '+(VOICE_LABEL[s.voice]||s.voice)+'</div></span>'+
      '<span class="dur">'+(active?'▶':(isFavorite(s.id)?'★':''))+'</span>'+
    '</div>';
  }).join('');
}

function renderFavList(){
  var favs = loadFavorites();
  $("songCount").textContent = favs.length;
  $("favCount").textContent = favs.length;
  $("search").style.display = 'none';
  document.querySelectorAll('.mode-line[data-type-filter] .mode-chip').forEach(function(c){ c.style.display = 'none'; });
  var el = $("songlist");
  if(!favs.length){
    el.innerHTML = '<div class="fav-empty">收藏夹为空<br>播放时点击播放条的 ☆ 收藏没听懂的句子</div>'+
      '<button class="fav-play" disabled>▶ 播放收藏序列</button>';
    return;
  }
  var html = '<button class="fav-play" id="favPlayBtn" title="按收藏顺序循环播放所有收藏句">▶ 播放收藏序列（'+favs.length+' 句）</button>';
  el.innerHTML = html + favs.map(function(x, i){
    var di = favs.length - 1 - i;          // 倒序：最新收藏在最上面
    var active = (favMode && curIdx >= 0 && PLAYLIST[curIdx] && PLAYLIST[curIdx].id === x.id);
    return '<div class="song'+(active?' active':'')+'" data-i="'+di+'">'+
      '<span class="no">'+(active?'♪':(i+1))+'</span>'+
      '<span class="tt"><div class="en">'+esc(x.en)+'</div>'+
      '<div class="kw">'+esc(x.keyword)+' · '+esc(x.meaning)+'</div></span>'+
      '<button class="fav-del" data-i="'+di+'" title="取消收藏">✕</button>'+
    '</div>';
  }).join('');
}

/* ===== 歌词渲染 ===== */
function renderLyric(){
  var s = curIdx >= 0 ? PLAYLIST[curIdx] : null;
  if(!s) return;
  $("lcKw").textContent = s.keyword;
  $("lcType").textContent = s.type === 'synonym' ? '同义词' : '考点词';
  $("lcMeaning").textContent = s.meaning;
  $("lcVoice").textContent = VOICE_LABEL[s.voice] || s.voice;
  $("pbTitle").textContent = s.en;
  $("pbSub").textContent = s.keyword + ' · ' + s.cn;

  // 歌词 = 所属词条的全部句子，当前句高亮（按 en 文本匹配）
  var entry = DATA.entries[s.entryIdx];
  var curEn = s.en;
  var el = $("lyric");
  if(settings.hideLyric){
    el.innerHTML = '<div class="lyric-off">字幕已隐藏 · 可在右上角「⚙ 设置」中恢复</div>';
    return;
  }
  el.innerHTML = entry.sentences.map(function(L, li){
    var active = (L.en === curEn);
    return '<div class="lyric-line'+(active?' active':'')+'" data-li="'+li+'">'+
      '<div class="en">'+esc(L.en)+'</div>'+
      (settings.showCn ? '<div class="cn">'+esc(L.cn)+'</div>' : '')+
    '</div>';
  }).join('');
  var curLine = -1;
  for(var k=0; k<entry.sentences.length; k++){ if(entry.sentences[k].en === curEn){ curLine = k; break; } }
  var lines = el.querySelectorAll('.lyric-line');
  if(lines[curLine]){ try{ lines[curLine].scrollIntoView({block:'center', behavior:'smooth'}); }catch(e){} }
  el.querySelectorAll('.lyric-line').forEach(function(ln){
    ln.addEventListener('click', function(){
      var li = parseInt(ln.getAttribute('data-li'));
      // 点击歌词行 -> 播放该句（按 en 文本匹配）
      var target = SONGS.find(function(x){ return x.entryIdx === s.entryIdx && x.en === entry.sentences[li].en; });
      if(!target) return;
      var pi = PLAYLIST.findIndex(function(x){ return x.id === target.id; });
      if(pi < 0){ activeType='all'; query=''; $("search").value=''; filterPlaylist(); pi = PLAYLIST.findIndex(function(x){ return x.id === target.id; }); }
      if(pi >= 0) playSong(pi, false);
    });
  });
}

/* ===== 播放控制 ===== */
var audio = $("audio");
var curBlobUrl = null;
var gapTimer = null, gapTick = null, gapNextFn = null;

function clearGap(){
  if(gapTimer){ clearTimeout(gapTimer); gapTimer = null; }
  if(gapTick){ clearInterval(gapTick); gapTick = null; }
  gapNextFn = null;
  $("gapHint").classList.remove("show");
}
function startGap(fn, ms){
  clearGap();
  gapNextFn = fn;
  var total = ms / 1000;
  var h = $("gapHint");
  h.classList.add("show");
  h.textContent = '⏳ 下一句 ' + total.toFixed(1) + 's · 点击跳过';
  var last = Date.now();
  gapTick = setInterval(function(){
    var left = total - (Date.now() - last) / 1000;
    if(left < 0) left = 0;
    h.textContent = '⏳ 下一句 ' + left.toFixed(1) + 's · 点击跳过';
  }, 100);
  gapTimer = setTimeout(function(){
    var f = gapNextFn;
    clearGap();
    if(f) f();
  }, ms);
}
function skipGap(){
  var f = gapNextFn;
  clearGap();
  if(f) f();
}

function playFavFrom(orderIdx, auto){
  var favs = loadFavorites();
  if(!favs.length){ favMode = false; favPos = -1; toast('收藏夹为空'); return; }
  if(orderIdx < 0) orderIdx = 0;
  if(orderIdx >= favs.length) orderIdx = 0;
  favMode = true;
  favPos = orderIdx;
  var s = SONGS.find(function(x){ return x.id === favs[orderIdx].id; });
  if(!s){ favMode = false; return; }
  var pi = PLAYLIST.findIndex(function(x){ return x.id === s.id; });
  if(pi < 0){ PLAYLIST.push(s); pi = PLAYLIST.length - 1; }
  playSong(pi, auto);
}
function playFavNext(auto){
  var favs = loadFavorites();
  if(!favs.length){ favMode = false; favPos = -1; toast('收藏夹已清空'); return; }
  var orders = favs.map(function(x){ return x.id; });
  var cur = curIdx >= 0 ? PLAYLIST[curIdx] : null;
  var pos = cur ? orders.indexOf(cur.id) : -1;
  var next = pos >= 0 ? (pos + 1) % orders.length : Math.min(favPos, orders.length - 1);
  playFavFrom(next, auto);
}

async function playSong(idx, auto){
  clearGap();
  if(!auto) favMode = false;
  if(!PLAYLIST.length) return;
  if(idx < 0) idx = PLAYLIST.length - 1;
  if(idx >= PLAYLIST.length) idx = 0;
  curIdx = idx;
  var s = PLAYLIST[idx];
  if(curBlobUrl){ try{ URL.revokeObjectURL(curBlobUrl); }catch(e){} curBlobUrl = null; }
  var src = await cachedAudioUrl(s.audio);
  if(src.indexOf('blob:') === 0) curBlobUrl = src;
  if(curIdx !== idx) return;      // 异步期间用户已切换
  audio.src = src;
  audio.play().catch(function(){});
  addHistory(s);
  renderSonglist();
  renderLyric();
  updateFavBtn();
  $("pbPlay").textContent = "⏸";
}

function nextIdx(){ return (curIdx + 1) % Math.max(1, PLAYLIST.length); }
function prevIdx(){ return (curIdx - 1 + PLAYLIST.length) % Math.max(1, PLAYLIST.length); }

function togglePlay(){
  if(gapTimer){ skipGap(); return; }
  if(curIdx < 0){ if(PLAYLIST.length) playSong(0, false); return; }
  if(audio.paused) audio.play(); else audio.pause();
}

function handleEnded(){
  if(favMode){ schedulePlay(function(){ playFavNext(true); }); return; }
  if(mode === 'single'){ audio.currentTime = 0; audio.play(); return; }
  if(mode === 'random'){
    if(PLAYLIST.length > 1){
      var r = Math.floor(Math.random()*PLAYLIST.length);
      schedulePlay(function(){ playSong(r, true); });
    }
    return;
  }
  schedulePlay(function(){ playSong(reverse ? prevIdx() : nextIdx(), true); });
}
function schedulePlay(fn){
  if(settings.gapPause > 0) startGap(fn, settings.gapPause * 1000);
  else fn();
}

function bindPlayer(){
  $("pbPlay").addEventListener("click", togglePlay);
  $("pbNext").addEventListener("click", function(){ if(PLAYLIST.length) playSong(nextIdx(), false); });
  $("pbPrev").addEventListener("click", function(){ if(PLAYLIST.length) playSong(prevIdx(), false); });
  $("pbFav").addEventListener("click", toggleFavorite);
  $("gapHint").addEventListener("click", skipGap);
  $("modeBtn").addEventListener("click", function(){
    if(mode === 'order'){ mode = 'single'; } else if(mode === 'single'){ mode = 'random'; } else { mode = 'order'; }
    updateModeBtn();
    toast(mode === 'order' ? '播放模式：顺序播放' : mode === 'single' ? '播放模式：单曲循环' : '播放模式：随机播放');
  });
  $("reverseBtn").addEventListener("click", function(){
    reverse = !reverse;
    updateModeBtn();
    toast(reverse ? '倒序播放 ON（上一句方向）' : '顺序播放 ON');
  });

  audio.addEventListener("play", function(){ $("pbPlay").textContent="⏸"; });
  audio.addEventListener("pause", function(){ $("pbPlay").textContent="▶"; });
  audio.addEventListener("ended", handleEnded);
  audio.addEventListener("timeupdate", function(){
    var pct = audio.duration ? (audio.currentTime/audio.duration*100) : 0;
    $("pbFill").style.width = pct + "%";
    $("pbTime").textContent = fmt(audio.currentTime) + " / " + fmt(audio.duration);
  });
  $("pbSeek").addEventListener("click", function(e){
    var r = e.currentTarget.getBoundingClientRect();
    var ratio = (e.clientX - r.left) / r.width;
    if(audio.duration) audio.currentTime = ratio * audio.duration;
  });
}

function bindSettings(){
  $("btnSettings").addEventListener("click", function(){
    $("settingsPanel").classList.add("show");
    $("settingsOverlay").classList.add("show");
    refreshCacheInfo();
  });
  function closeSettings(){
    $("settingsPanel").classList.remove("show");
    $("settingsOverlay").classList.remove("show");
  }
  $("btnSettingsX").addEventListener("click", closeSettings);
  $("settingsOverlay").addEventListener("click", closeSettings);

  document.querySelectorAll("#themeSeg button").forEach(function(b){
    b.addEventListener("click", function(){
      settings.theme = b.getAttribute("data-theme-val");
      applyTheme();
      saveSettings();
      toast(settings.theme === 'light' ? '已切换浅色主题' : '已切换深色主题');
    });
  });
  $("optHide").addEventListener("change", function(){
    settings.hideLyric = this.checked;
    saveSettings();
    renderLyric();
    toast(settings.hideLyric ? '已隐藏全部字幕' : '已恢复显示字幕');
  });
  $("optCn").addEventListener("change", function(){
    settings.showCn = this.checked;
    saveSettings();
    renderLyric();
    toast(settings.showCn ? '已显示中文歌词' : '已隐藏中文歌词');
  });
  $("optCache").addEventListener("change", function(){
    settings.cacheAudio = this.checked;
    saveSettings();
    toast(settings.cacheAudio ? '音频缓存已开启' : '音频缓存已关闭');
  });
  $("optGap").addEventListener("input", function(){
    settings.gapPause = parseFloat(this.value);
    saveSettings();
    $("gapVal").textContent = settings.gapPause + ' 秒';
  });
  $("btnClearCache").addEventListener("click", function(){
    if(!confirm("确定清除已缓存的音频？")) return;
    clearAudioCache();
  });
}

function closeSidebar(){
  $("sidebar").classList.remove("open");
  $("sidebarOverlay").classList.remove("show");
}

function updateModeBtn(){
  var m = $("modeBtn");
  m.textContent = mode === 'order' ? '🔁' : mode === 'single' ? '🔂' : '🎲';
  m.classList.toggle("on", mode !== 'order');
  var r = $("reverseBtn");
  r.textContent = reverse ? '⏪' : '⏩';
  r.classList.toggle("on", reverse);
}

/* ===== 歌单/搜索/筛选 ===== */
$("songlist").addEventListener("click", function(e){
  var del = e.target.closest(".fav-del");
  if(del){
    e.stopPropagation();
    var favs = loadFavorites();
    var di = parseInt(del.getAttribute("data-i"));
    var id = favs[di] ? favs[di].id : -1;
    favs.splice(di, 1);
    saveFavorites(favs);
    if(favMode && curIdx >= 0 && PLAYLIST[curIdx] && PLAYLIST[curIdx].id === id) favMode = false;
    renderSonglist();
    updateFavBtn();
    toast('已取消收藏');
    return;
  }
  if(e.target.closest("#favPlayBtn")){
    playFavFrom(0, true);
    closeSidebar();
    toast('正在播放收藏序列，共 ' + loadFavorites().length + ' 句');
    return;
  }
  var song = e.target.closest(".song");
  if(!song) return;
  var i = parseInt(song.getAttribute("data-i"));
  if(viewMode === 'fav'){
    var favs = loadFavorites();
    var orderIdx = favs.length - 1 - i;      // 倒序索引 -> 正序位置
    playFavFrom(orderIdx, true);
  }else{
    playSong(i, false);
  }
  closeSidebar();
});

$("btnSonglist").addEventListener("click", function(){
  $("sidebar").classList.add("open");
  $("sidebarOverlay").classList.add("show");
});
$("sidebarOverlay").addEventListener("click", closeSidebar);

$("search").addEventListener("input", function(){
  query = $("search").value.trim();
  renderSonglist();
});

document.querySelectorAll(".fav-seg .mode-chip").forEach(function(chip){
  chip.addEventListener("click", function(){
    document.querySelectorAll(".fav-seg .mode-chip").forEach(function(c){ c.classList.remove("on"); });
    chip.classList.add("on");
    viewMode = chip.getAttribute("data-view");
    renderSonglist();
  });
});

document.querySelectorAll(".mode-chip[data-mode]").forEach(function(chip){
  chip.addEventListener("click", function(){
    document.querySelectorAll(".mode-chip[data-mode]").forEach(function(c){ c.classList.remove("on"); });
    chip.classList.add("on");
    activeType = chip.getAttribute("data-mode");
    renderSonglist();
  });
});

/* ===== 最近播放 ===== */
function renderHistory(){
  var h = loadHistory();
  var el = $("historyList");
  if(!h.length){ el.innerHTML = '<div class="h-empty">暂无播放记录，播放过的句子会显示在这里</div>'; return; }
  el.innerHTML = h.map(function(x, i){
    var d = new Date(x.ts);
    var when = (d.getMonth()+1)+'月'+d.getDate()+'日 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    return '<div class="h-item" data-i="'+i+'">'+
      '<div class="t"><div class="en">'+esc(x.en)+'</div><div class="kw">'+esc(x.kw)+' · '+(VOICE_LABEL[x.voice]||x.voice)+'</div></div>'+
      '<span class="when">'+when+'</span>'+
      '<button class="del" title="删除">✕</button>'+
    '</div>';
  }).join('');
  el.querySelectorAll('.h-item').forEach(function(item){
    item.addEventListener('click', function(e){
      if(e.target.closest('.del')) return;
      var idx = parseInt(item.getAttribute('data-i'));
      var hh = loadHistory()[idx];
      if(!hh) return;
      var target = SONGS.find(function(s){ return s.id === hh.id; });
      if(target){
        var pi = PLAYLIST.findIndex(function(x){ return x.id === target.id; });
        if(pi < 0){ activeType='all'; query=''; $("search").value=''; filterPlaylist(); pi = PLAYLIST.findIndex(function(x){ return x.id === target.id; }); }
        if(pi >= 0){ playSong(pi, false); return; }
      }
      // 从历史直接播
      var fake = { id:hh.id, type:'history', keyword:hh.kw, meaning:hh.meaning, en:hh.en,
        cn:hh.cn, voice:hh.voice, audio:hh.audio, entryIdx:-1 };
      SONGS.push(fake);
      PLAYLIST.push(fake);
      playSong(PLAYLIST.length-1, false);
    });
    item.querySelector('.del').addEventListener('click', function(e){
      e.stopPropagation();
      var idx = parseInt(item.closest('.h-item').getAttribute('data-i'));
      var h = loadHistory(); h.splice(idx,1); saveHistory(h); renderHistory();
    });
  });
}

$("btnHistory").addEventListener("click", function(){
  var show = $("historyPanel").classList.toggle("show");
  $("lyricPanel").style.display = show ? "none" : "";
  this.classList.toggle("active", show);
  $("btnLyric").classList.toggle("active", !show);
  renderHistory();
});
$("btnLyric").addEventListener("click", function(){
  $("historyPanel").classList.remove("show");
  $("lyricPanel").style.display = "";
  $("btnHistory").classList.remove("active");
  this.classList.add("active");
  renderLyric();
});
$("btnClearHist").addEventListener("click", function(){
  if(!confirm("确定清空全部播放记录？")) return;
  saveHistory([]);
  renderHistory();
  toast("已清空播放记录");
});

  buildSongs();

  renderHistory();
  updateModeBtn();
  bindPlayer();
  bindSettings();
